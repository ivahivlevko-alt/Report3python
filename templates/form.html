{% extends 'base.html' %}
{% block content %}
<h3 class="page-title mb-3">{{ title }}</h3>
<div class="row"><div class="col-lg-6">
<form method="post" class="card card-body">{% csrf_token %}
  {{ form.non_field_errors }}
  {% for f in form %}
  <div class="mb-3"><label class="form-label">{{ f.label }}</label>{{ f }}
    {% for e in f.errors %}<div class="text-danger small">{{ e }}</div>{% endfor %}</div>
  {% endfor %}
  <div><button class="btn btn-brand">Зберегти</button>
  <a class="btn btn-link" href="javascript:history.back()">Скасувати</a></div>
</form></div></div>
{% endblock %}
