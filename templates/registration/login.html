{% extends 'base.html' %}
{% block title %}Вхід{% endblock %}
{% block content %}
<div class="auth-wrap">
  <div class="auth-box">
    <div class="auth-brand">
      <span class="brand-mark">₴</span>
      <h1>Облік супермаркету</h1>
      <p>Увійдіть, щоб працювати з товарами та замовленнями</p>
    </div>
    <div class="card login-card"><div class="card-body">
      <form method="post">{% csrf_token %}
        <div class="mb-3"><label class="form-label" for="id_username">Логін</label>
          <input id="id_username" name="username" class="form-control" autocomplete="username" autocapitalize="none" autofocus required></div>
        <div class="mb-3"><label class="form-label" for="id_password">Пароль</label>
          <input id="id_password" type="password" name="password" class="form-control" autocomplete="current-password" required></div>
        {% if form.errors %}<div class="alert alert-danger">Невірний логін або пароль.</div>{% endif %}
        <button class="btn btn-brand w-100">Увійти</button>
      </form>
    </div></div>
  </div>
</div>
{% endblock %}
