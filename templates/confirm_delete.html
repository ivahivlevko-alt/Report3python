{% extends 'base.html' %}
{% block content %}
<h3 class="page-title mb-3">Підтвердження видалення</h3>
<div class="card card-body col-lg-6">
  <p>Ви впевнені, що хочете видалити «{{ object }}»? Цю дію не можна скасувати.</p>
  <form method="post">{% csrf_token %}
    <button class="btn btn-danger">Так, видалити</button>
    <a class="btn btn-link" href="javascript:history.back()">Ні, повернутися</a>
  </form>
</div>
{% endblock %}
